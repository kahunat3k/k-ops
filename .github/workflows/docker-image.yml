name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - homolog
      - main
      - "feature/*"  # Qualquer branch feature/

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome da branch como variável (removendo "/")
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr '/' '-')" >> $GITHUB_ENV

      # Escolha um dos logins abaixo (Docker Hub ou GHCR)
      
      - name: Login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      
      # - name: Login no GHCR (GitHub Container Registry)
      #   run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir imagem Docker
        run: |
          docker build -t zMatths/minha-imagem:${{ env.BRANCH_NAME }} .

      - name: Enviar imagem para o Docker Registry
        run: |
          docker push zMatths/minha-imagem:${{ env.BRANCH_NAME }}
