name: Build and Push Docker Image

on:
  workflow_dispatch: # Permite executar manualmente o workflow para testes

jobs:
  setting-environment:
    runs-on: [self-hosted] # Altere para o rótulo do seu runner, se necessário
    outputs:
      branch-name: ${{ steps.set-branch.outputs.branch }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Definir nome da branch de origem como variável (sem "/")
        id: set-branch
        run: |
          BRANCH_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

  build:
    needs: setting-environment
    runs-on: [self-hosted] # Altere para o rótulo do seu runner, se necessário
    outputs:
      build-success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Build da imagem Docker
        id: build
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ needs.setting-environment.outputs.branch-name }} .

  sonar-code-analysis:
    needs: setting-environment
    runs-on: [self-hosted] # Altere para o rótulo do seu runner, se necessário
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar SonarScanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-4.8.0.2856-linux sonar-scanner
          echo "$(pwd)/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Rodar SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=k-ops-sonar-yaml \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=$SONAR_TOKEN

  image-analyzer:
    needs: [build, sonar-code-analysis]
    runs-on: [self-hosted] # Altere para o rótulo do seu runner, se necessário
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Simular análise de imagem
        run: |
          echo "Analisando imagem gerada..."
          # Substitua por uma ferramenta de análise de segurança, como Trivy

  push:
    needs: [build, image-analyzer]
    runs-on: [self-hosted] # Altere para o rótulo do seu runner, se necessário
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push da imagem para GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ needs.build.outputs.branch-name }}